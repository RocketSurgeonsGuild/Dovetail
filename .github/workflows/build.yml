name: Build

on:
    push:
        branches:
            - main
            - next
        tags:
            - v*
    pull_request:
        branches:
            - main
            - next
    merge_group:
        branches:
            - main
            - next

permissions:
    contents: read

# A newer run for the same branch (or pull request head) cancels this one; tags and merge-queue refs are unique.
concurrency:
    group: build-${{ github.event_name }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  clean: 'false'
                  fetch-depth: '0'
            - name: 🛠️ Setup mise
              uses: jdx/mise-action@v5
              env:
                  # One install at a time: mise downloads dotnet-install.sh to one shared path for every dotnet version, so the
                  # SDK and runtime installs overwrite it under each other ("failed to execute command") when they run in parallel.
                  MISE_JOBS: '1'
              with:
                  install: true
                  # Only dotnet (the SDK and the runtime) here; the other tools install in parallel in the next step.
                  install_args: dotnet
                  # One cache for every tool: restored here, before anything installs, and saved in the post step
                  # (cache_save_post), after the next step's tools and the pruning at the end of the job. The key is fixed
                  # rather than hashed from the tool versions, so a bump doesn't start a new multi-GB cache; it rolls over
                  # every cache_max_age_days to pick up bumps. Only main saves it (pull requests and the merge queue each
                  # have their own cache scope, so saving there would make one per ref); every ref can restore main's.
                  cache: true
                  cache_key: mise-{{platform}}-{{cache_period}}
                  cache_max_age_days: 7
                  cache_save: ${{ github.ref == 'refs/heads/main' }}
                  cache_save_post: true
                  experimental: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}
            # Everything but dotnet, in parallel (mise's default jobs). Naming the tools keeps `mise install` from running
            # dotnet's `when = "always"` postinstall (the workloads) a second time.
            - name: 🧰 Install tools
              run: mise ls --current --local --json | jq -r 'keys[] | select(. != "dotnet")' | xargs mise install
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: ⚙️ Build
              id: build
              run: |
                  mise run build
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NUGET_API_KEY: ${{ secrets.RSG_NUGET_API_KEY }}
            - name: 🏺 Save GitHub event
              if: always()
              run: cp "$GITHUB_EVENT_PATH" artifacts/event.json || true
            - name: 🏺 Publish logs
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: logs
                  # Test results and coverage have their own artifacts below; the HTML coverage report alone is over 1 GB.
                  path: |
                      artifacts/logs/
                      !artifacts/logs/tests/
                      !artifacts/logs/coverage/
            - name: 🏺 Publish test data
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test data
                  # The pipeline writes test results and coverage under artifacts/logs/ (Publish Results reads both artifacts).
                  path: artifacts/logs/tests/
            - name: 🏺 Publish coverage data
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: artifacts/logs/coverage/
            - name: 🏺 Publish NuGet Packages
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: nuget
                  path: artifacts/nuget/
            - name: 🏺 Publish event
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: event
                  path: artifacts/event.json
            # Before the post step saves the mise cache: drop tool versions nothing selects anymore, so it holds only the
            # current ones.
            - name: 🧹 Prune tools
              if: always() && github.ref == 'refs/heads/main'
              run: mise prune --tools
