name: Workload samples

# Builds the samples that need .NET workloads (sample/Sample.Maui, sample/Sample.Uno, sample/Sample.Uno.Net11), which
# Dovetail.slnx leaves out of the solution build. Each leg installs the workloads its runner can build and picks those heads
# through DovetailSampleTargetFrameworks (';' is passed as %3B, since MSBuild splits -p: values on it).

on:
    push:
        branches:
            - main
            - next
        tags:
            - v*
    pull_request:
        branches:
            - main
            - next
    merge_group:
        branches:
            - main
            - next

permissions:
    contents: read

jobs:
    samples:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: Linux (Android, Uno desktop and WebAssembly)
                      os: ubuntu-latest
                      workloads: maui-android android wasm-tools
                      maui: net10.0-android%3Bnet11.0-android
                      uno: net10.0-desktop%3Bnet10.0-browserwasm%3Bnet10.0-android
                      uno-net11: net11.0-android
                    - name: macOS (iOS, Mac Catalyst)
                      os: macos-latest
                      workloads: maui ios maccatalyst
                      maui: net10.0-ios%3Bnet10.0-maccatalyst%3Bnet11.0-ios%3Bnet11.0-maccatalyst
                      uno: net10.0-ios
                      uno-net11: net11.0-ios
                    - name: Windows
                      os: windows-latest
                      workloads: maui-windows
                      maui: net10.0-windows10.0.19041.0%3Bnet11.0-windows10.0.19041.0
                      uno: net10.0-windows10.0.26100
                      uno-net11: net11.0-windows10.0.26100
        defaults:
            run:
                shell: bash
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: '0'
            - name: 🛠️ Setup mise
              uses: jdx/mise-action@v5
              with:
                  install: true
                  cache: true
                  cache_key_prefix: mise-v2
                  experimental: true
                  github_token: ${{ secrets.GITHUB_TOKEN }}
            - name: 📦 Install workloads
              run: |
                  read -ra workloads <<< "$WORKLOADS"
                  dotnet workload install "${workloads[@]}"
              env:
                  WORKLOADS: ${{ matrix.workloads }}
            - name: ⚙️ Build Sample.Maui
              run: dotnet build sample/Sample.Maui/Sample.Maui.csproj "-p:DovetailSampleTargetFrameworks=$HEADS" -bl:artifacts/logs/Sample.Maui.binlog
              env:
                  HEADS: ${{ matrix.maui }}
            - name: ⚙️ Build Sample.Uno
              if: always()
              run: dotnet build sample/Sample.Uno/Sample.Uno.csproj "-p:DovetailSampleTargetFrameworks=$HEADS" -bl:artifacts/logs/Sample.Uno.binlog
              env:
                  HEADS: ${{ matrix.uno }}
            - name: ⚙️ Build Sample.Uno.Net11
              if: always()
              run: dotnet build sample/Sample.Uno.Net11/Sample.Uno.Net11.csproj "-p:DovetailSampleTargetFrameworks=$HEADS" -bl:artifacts/logs/Sample.Uno.Net11.binlog
              env:
                  HEADS: ${{ matrix.uno-net11 }}
            - name: 🏺 Publish logs
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: workload-samples-logs-${{ matrix.os }}
                  path: artifacts/logs/
