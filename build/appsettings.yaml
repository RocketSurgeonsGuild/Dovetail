solution: Dovetail.slnx
# Coverage settings for the TestSolution module (the library writes its own default when this is missing).
runSettings: test/coverage.runsettings
# One `dotnet test` over the solution, as before. Joinery.Dovetail.Sdk.Tests is most of the test time and keeps all four of a CI
# runner's cores busy on its own, so the library's per-project mode (its default) has nothing to fit beside it and is no shorter.
TestMode: Solution
